"$schema" = 'https://starship.rs/config-schema.json'

# Based on the Tokyo Night preset (`starship preset tokyo-night`), without the
# time or git status segments and without background colors. A thin orange strip
# (the tmux active-tab orange) starts the line. Needs a Nerd Font.

format = """
[▎](#e5964f) \
$directory\
$git_branch\
$nodejs\
$bun\
$rust\
$golang\
$php\
$c\
$java\
$kotlin\
$haskell\
$python\
\n$character"""

[directory]
style = ""
format = "[$path ]($style)"
truncation_length = 2
truncation_symbol = "../"
truncate_to_repo = false

[git_branch]
style = ""
symbol = ""
format = '[$symbol $branch ]($style)'

[nodejs]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[bun]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[rust]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[golang]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[php]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[c]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[java]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[kotlin]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[haskell]
style = ""
symbol = ""
format = '[$symbol ($version) ]($style)'

[python]
style = ""
symbol = ""
format = '[$symbol ($version)(\(#$virtualenv\)) ]($style)'


[character]
success_symbol = '[>](bold #344254)'
error_symbol = '[>](bold #344254)'
vimcmd_symbol = '[<](bold #9ece6a)'
vimcmd_replace_one_symbol = '[<](bold #bb9af7)'
vimcmd_replace_symbol = '[<](bold #bb9af7)'
vimcmd_visual_symbol = '[<](bold #e0af68)'
