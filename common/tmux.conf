# ~/.config/tmux/tmux.conf
# Installed by scripts/wsl-setup.sh and scripts/dev-setup.sh
# Reload inside tmux:  <prefix> r
#
# Glossary:
#   prefix  = the leader key you press BEFORE a tmux command (here: backtick `)
#   session = a collection of windows (survives if you disconnect)
#   window  = a "tab" in the status bar
#   pane    = a split inside a window

# ------------------------------------------------------------------------------
# Prefix
# ------------------------------------------------------------------------------
# Backtick is a single-key leader: no Ctrl chord needed.
set -g prefix `
set -g prefix2 None
# Press ` twice to type a literal backtick.
bind ` send-prefix

# Remove Ctrl-key bindings (defaults and leftovers from older configs).
unbind C-b
unbind C-a
unbind C-g
unbind C-o
unbind C-z
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# ------------------------------------------------------------------------------
# General
# ------------------------------------------------------------------------------
set -g mouse on                 # Click to select panes/windows, drag borders to resize, scroll with wheel
set -g history-limit 50000      # Much larger scrollback buffer
set -sg escape-time 10          # No lag after pressing Esc (important for vim/nvim)
set -g focus-events on          # Lets nvim know when it gains/loses focus (autoread etc.)
set -g display-time 2000        # Show tmux messages for 2s
set -g repeat-time 500          # Window for repeating keys like resize without re-pressing prefix
setw -g aggressive-resize on    # Size windows to the smallest client actually viewing them

# Start numbering at 1 so it matches the keyboard layout (0 is far away).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on      # Close window 2 of 1,2,3 -> becomes 1,2 (no gaps)

# True color + proper terminal type (makes nvim themes look correct).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# Allow programs to set the system clipboard via OSC 52 (works over SSH / web terminals).
set -g set-clipboard on

# Set the terminal/tab title to the current session and window.
set -g set-titles on
set -g set-titles-string "#S / #W"

# ------------------------------------------------------------------------------
# Key bindings
# ------------------------------------------------------------------------------
# Reload this config.
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Split panes with intuitive keys, keeping the current directory.
#   |  = split side by side      -  = split top/bottom
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows also open in the current directory.
bind c new-window -c "#{pane_current_path}"

# Move between panes vim-style: <prefix> h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move between panes WITHOUT the prefix: Alt + arrow keys
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes: <prefix> H/J/K/L (hold prefix-free for repeats thanks to -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows WITHOUT the prefix: Alt + 1..9, and Shift + left/right arrows
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reorder windows: <prefix> < and >
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Jump back to the last-used window.
bind Tab last-window

# Kill pane/window with confirmation-free, predictable keys.
bind x kill-pane
bind X kill-window

# Quickly toggle pane zoom (fullscreen the current pane): <prefix> z  (built-in, listed for reference)

# ------------------------------------------------------------------------------
# Normal mode (vim-style, no prefix)
# ------------------------------------------------------------------------------
# Esc = enter normal mode.   i = back to terminal mode.
# Ctrl+E sends Esc to the program (vim, the shell, ...) instead.
bind -n Escape switch-client -T normal
bind -n C-e send-keys Escape

# Every normal-mode binding re-enters the table so the mode sticks.
bind -T normal t    new-window -c "#{pane_current_path}"   \; switch-client -T normal
bind -T normal h    previous-window                        \; switch-client -T normal
bind -T normal l    next-window                            \; switch-client -T normal
bind -T normal |    split-window -h -c "#{pane_current_path}" \; switch-client -T normal
bind -T normal \\   split-window -v -c "#{pane_current_path}" \; switch-client -T normal
bind -T normal -    kill-window                            \; switch-client -T normal
bind -T normal i    switch-client -T root
# Mouse still works in normal mode: click a tab or pane, scroll over the tabs.
bind -T normal MouseDown1Status select-window -t =         \; switch-client -T normal
bind -T normal WheelUpStatus    previous-window            \; switch-client -T normal
bind -T normal WheelDownStatus  next-window                \; switch-client -T normal
bind -T normal MouseDown1Pane   select-pane -t =           \; switch-client -T normal
# Swallow every other key so typing doesn't leak into the terminal.
bind -T normal Any  switch-client -T normal

# Send the same keystrokes to all panes in the window (toggle).
bind S setw synchronize-panes \; display "Synchronize panes: #{?synchronize-panes,ON,OFF}"

# ------------------------------------------------------------------------------
# Copy mode (vi keys, since you use `set -o vi` and nvim)
# ------------------------------------------------------------------------------
# Enter copy mode: <prefix> [   (or just scroll up with the mouse)
# Then: v = start selection, V = select line, r = block select, y = copy, q = quit
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
unbind -T copy-mode-vi C-v
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Don't jump to the bottom after selecting text with the mouse.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
# Paste: <prefix> p
bind p paste-buffer

# Vi keys in the tmux command prompt (<prefix> :)
set -g status-keys vi

# ------------------------------------------------------------------------------
# Look & feel
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
# Palette: darq (matches the nvim theme)
#   bg #151515  dark #1e1e1e  raised #252525  selection #1e334f
#   fg #f1f2f4  dim #8f9299   red #e94646     green #11c965
#   yellow #f7b750  blue #6da6f5  purple #b699eb  cyan #71d0d5
# Transparent bar (uses the terminal background).
set -g status-style "bg=default,fg=#8f9299"

# Two status lines: a blank one on top for padding, the real bar below it.
# status-format[1] is tmux's built-in default line format.
set -g status 2
set -g status-format[0] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

set -g status-left ""
set -g status-right-length 60
set -g status-right "#{?#{==:#{client_key_table},normal},#[fg=#e5964f] ⌘ #[default],}"

# No background on tabs: active = orange text, inactive = dim text.
setw -g window-status-style "bg=default,fg=#5f6268"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "bg=default,fg=#e5964f,bold"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-separator ""
# Activity/bell: keep inactive tabs dim (default is reverse video).
setw -g window-status-activity-style "bg=default,fg=#5f6268"
setw -g window-status-bell-style "bg=default,fg=#5f6268"

set -g pane-border-style "fg=#252525"
set -g pane-active-border-style "fg=#6da6f5"
set -g message-style "bg=#252525,fg=#f1f2f4"
set -g message-command-style "bg=#252525,fg=#b699eb"
setw -g mode-style "bg=#1e334f,fg=#f1f2f4"

# Highlight windows with activity (output while you're not looking) without beeping.
setw -g monitor-activity on
set -g visual-activity off
